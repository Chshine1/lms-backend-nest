#file: noinspection SpellCheckingInspection
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
    ports:
      - '5432:5432'
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lms']
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: node:24.14.0-alpine
    working_dir: /app
    environment:
      - DB_HOST=postgres
    volumes:
      - ./apps:/app/apps:ro
      - ./libs:/app/libs:ro
      - ./migrations:/app/migrations:ro
      - ./node_modules:/app/node_modules:ro
      - ./.yarn/releases:/app/.yarn/releases:ro
      - ./.yarnrc.yml:/app/.yarnrc.yml:ro
      - ./package.json:/app/package.json:ro
      - ./yarn.lock:/app/yarn.lock:ro
    command: sh -c "yarn run migration:run"
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lms
      RABBITMQ_DEFAULT_PASS: lms
    ports:
      - '5672:5672'
      - '15672:15672'
    tmpfs:
      - /var/lib/rabbitmq:size=128m
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 5

  loki:
    image: grafana/loki:3.2.1
    ports:
      - '3100:3100'
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.2.1
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - '3030:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      promtail:
        condition: service_started
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: gateway
      CONFIG_BASE_PATH: /app/config

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: user-service
      CONFIG_BASE_PATH: /app/config

  course-service:
    build:
      context: .
      dockerfile: apps/course-service/Dockerfile
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: course-service
      CONFIG_BASE_PATH: /app/config

  assignment-service:
    build:
      context: .
      dockerfile: apps/assignment-service/Dockerfile
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: assignment-service
      CONFIG_BASE_PATH: /app/config

  course-enrollment-service:
    build:
      context: .
      dockerfile: apps/course-enrollment-service/Dockerfile
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: course-enrollment-service
      CONFIG_BASE_PATH: /app/config

  course-scheduling-service:
    build:
      context: .
      dockerfile: apps/course-scheduling-service/Dockerfile
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: course-scheduling-service
      CONFIG_BASE_PATH: /app/config

  file-service:
    build:
      context: .
      dockerfile: apps/file-service/Dockerfile
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: file-service
      CONFIG_BASE_PATH: /app/config

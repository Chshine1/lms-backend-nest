#file: noinspection SpellCheckingInspection
networks:
  loki-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
    ports:
      - '5432:5432'
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lms']
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: node:24.14.0-alpine
    container_name: migrations
    working_dir: /app
    environment:
      - DB_HOST=postgres
    volumes:
      - ./apps:/app/apps:ro
      - ./libs:/app/libs:ro
      - ./migrations:/app/migrations:ro
      - ./node_modules:/app/node_modules:ro
      - ./.yarn/releases:/app/.yarn/releases:ro
      - ./.yarnrc.yml:/app/.yarnrc.yml:ro
      - ./package.json:/app/package.json:ro
      - ./yarn.lock:/app/yarn.lock:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./mikro-orm.config.ts:/app/mikro-orm.config.ts:ro
    # command: sh -c "yarn run migration:run"
    command: sh -c "node_modules/.bin/ts-node -r tsconfig-paths/register node_modules/.bin/mikro-orm migration:up --config mikro-orm.config.ts"
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lms
      RABBITMQ_DEFAULT_PASS: lms
    ports:
      - '5672:5672'
      - '15672:15672'
    tmpfs:
      - /var/lib/rabbitmq:size=128m
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 5
    command: >
      sh -c "
        rabbitmq-server &
        RABBIT_PID=$$!
        rabbitmqctl wait --timeout 60 /var/lib/rabbitmq/mnesia/rabbit@$${HOSTNAME}.pid
        rabbitmqctl set_user_tags lms administrator
        wait $$RABBIT_PID
      "

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    ports:
      - '3100:3100'
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    tmpfs:
      - /tmp/loki:rw,noexec,nosuid,size=256M,uid=10001
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - loki-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.2.1
    container_name: promtail
    ports:
      - '9080:9080'
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    tmpfs:
      - /tmp/promtail:rw,noexec,nosuid,size=64M
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - loki-net
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    ports:
      - '3030:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - loki-net
    depends_on:
      loki:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: gateway
    ports:
      - '3000:3000'
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      promtail:
        condition: service_started
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: gateway
      CONFIG_BASE_PATH: /app/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: user-service
    ports:
      - '3001:3001'
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: user-service
      CONFIG_BASE_PATH: /app/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  course-service:
    build:
      context: .
      dockerfile: apps/course-service/Dockerfile
    container_name: course-service
    ports:
      - '3002:3002'
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: course-service
      CONFIG_BASE_PATH: /app/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3002/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  assessment-service:
    build:
      context: .
      dockerfile: apps/assessment-service/Dockerfile
    container_name: assessment-service
    ports:
      - '3003:3003'
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: assessment-service
      CONFIG_BASE_PATH: /app/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3003/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

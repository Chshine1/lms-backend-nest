#file: noinspection SpellCheckingInspection
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lms']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lms
      RABBITMQ_DEFAULT_PASS: lms
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: lms
      DB_PASSWORD: lms
      DB_DATABASE: lms
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: lms
      RABBITMQ_PASSWORD: lms

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: lms
      DB_PASSWORD: lms
      DB_DATABASE: lms
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: lms
      RABBITMQ_PASSWORD: lms

  course-service:
    build:
      context: .
      dockerfile: apps/course-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: lms
      DB_PASSWORD: lms
      DB_DATABASE: lms
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: lms
      RABBITMQ_PASSWORD: lms

  assignment-service:
    build:
      context: .
      dockerfile: apps/assignment-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: lms
      DB_PASSWORD: lms
      DB_DATABASE: lms
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: lms
      RABBITMQ_PASSWORD: lms

  course-enrollment-service:
    build:
      context: .
      dockerfile: apps/course-enrollment-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: lms
      DB_PASSWORD: lms
      DB_DATABASE: lms
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: lms
      RABBITMQ_PASSWORD: lms

  course-scheduling-service:
    build:
      context: .
      dockerfile: apps/course-scheduling-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: lms
      RABBITMQ_PASSWORD: lms

  file-service:
    build:
      context: .
      dockerfile: apps/file-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: lms
      RABBITMQ_PASSWORD: lms

volumes:
  postgres_data:
  rabbitmq_data:
